name: Release

on:
  push:
    tags:
      # Coarse filter only. The authoritative grammar is RELEASE_TAG_REGEX in
      # scripts/release-tag.sh, validated in the publish job below. This glob
      # must stay at least as permissive as that regex: a stricter glob would
      # let a valid tag push and then silently never build.
      - "v*-r*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  repo-checks:
    name: Shell syntax and documentation consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse every tracked script and check documented facts
        run: ./test/repo-checks.sh
      - name: Require every image to be named once, by digest
        run: ./test/docker-image-pins.sh

  build-and-smoke:
    name: Build and smoke-test (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: repo-checks
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            variant: standard
            artifact: xvfb-static-linux-x86_64
            archive: out/x86_64/xvfb-static-linux-x86_64.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: standard
            artifact: xvfb-static-linux-aarch64
            archive: out/aarch64/xvfb-static-linux-aarch64.tar.gz
          - arch: x86_64
            runner: ubuntu-24.04
            variant: glx-llvmpipe
            glx-backend: llvmpipe
            artifact: xvfb-static-glx-llvmpipe-alpha-linux-x86_64
            archive: out/glx-llvmpipe-alpha/x86_64/xvfb-static-glx-llvmpipe-alpha-linux-x86_64.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: glx-llvmpipe
            glx-backend: llvmpipe
            artifact: xvfb-static-glx-llvmpipe-alpha-linux-aarch64
            archive: out/glx-llvmpipe-alpha/aarch64/xvfb-static-glx-llvmpipe-alpha-linux-aarch64.tar.gz
          - arch: x86_64
            runner: ubuntu-24.04
            variant: glx-external-vulkan
            glx-backend: zink
            artifact: xvfb-static-glx-external-vulkan-alpha-linux-x86_64
            archive: out/glx-external-vulkan-alpha/x86_64/xvfb-static-glx-external-vulkan-alpha-linux-x86_64.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: glx-external-vulkan
            glx-backend: zink
            artifact: xvfb-static-glx-external-vulkan-alpha-linux-aarch64
            archive: out/glx-external-vulkan-alpha/aarch64/xvfb-static-glx-external-vulkan-alpha-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      CACHIX_CACHE_NAME: xvfb-static
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.variant == 'standard'
        name: Build standard archive
        run: ./build.sh "${{ matrix.arch }}"
      - if: matrix.variant == 'glx-llvmpipe'
        name: Build GLX llvmpipe alpha archive
        run: ./build-glx-llvmpipe.sh "${{ matrix.arch }}"
      - if: matrix.variant == 'glx-external-vulkan'
        name: Build GLX external Vulkan alpha archive
        run: ./build-glx-external-vulkan.sh "${{ matrix.arch }}"
      - if: matrix.variant == 'standard'
        name: Verify all embedded keyboard profiles
        run: ./test/integration.sh "${{ matrix.arch }}"
      - if: matrix.variant == 'glx-llvmpipe' || matrix.variant == 'glx-external-vulkan'
        name: Build GLX render test
        run: |
          docker run --rm \
            -e CACHIX_CACHE_NAME -e CACHIX_AUTH_TOKEN -e CACHIX_SIGNING_KEY \
            -v "$PWD":/src -w /src \
            -v xvfb-static-nix:/nix \
            "$(cat build-image.txt)" \
            sh -eu -c '
              git config --global --add safe.directory /src
              bash /src/nix-build-cached.sh nix \
                --extra-experimental-features "nix-command flakes" build \
                --impure --file /src/test/glx-render.nix \
                --argstr backend "${{ matrix.glx-backend }}" \
                --out-link /tmp/result-glx-render-test --option log-lines 200
              test -x /tmp/result-glx-render-test/bin/glx-render-test
              rm -rf /src/result-glx-render-test
              mkdir -p /src/result-glx-render-test/bin
              install -m 0755 /tmp/result-glx-render-test/bin/glx-render-test \
                /src/result-glx-render-test/bin/glx-render-test
            '
          test -x result-glx-render-test/bin/glx-render-test
      # Archive shape, manifest inventory, and licence checks are variant
      # agnostic and must cover every published archive.
      - name: Check archive shape, manifest, and licences
        run: ./test/archive-checks.sh "${{ matrix.archive }}"
      # Only the static-linkage assertion and the Alpine boot matrix are
      # specific to the fully static variants. The external Vulkan artifact
      # intentionally uses the host glibc and Vulkan loader, so it takes its
      # own ABI/Zink test instead.
      - if: matrix.variant != 'glx-external-vulkan'
        name: Boot packaged Xvfb in clean Alpine
        run: ./test/smoke.sh "${{ matrix.archive }}"
      - if: matrix.variant == 'glx-llvmpipe'
        name: Render with packaged GLX llvmpipe alpha
        run: ./test/glx-llvmpipe-smoke.sh "${{ matrix.archive }}"
      - if: matrix.variant == 'glx-external-vulkan'
        name: Verify manylinux_2_28 toolchain and glibc symbol floor
        run: ./test/manylinux-2-28-toolchain.sh
      - if: matrix.variant == 'glx-external-vulkan'
        name: Verify external Vulkan ABI and Zink render
        run: ./test/glx-external-vulkan-smoke.sh "${{ matrix.archive }}"
      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ matrix.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-and-smoke
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: xvfb-static-*
          path: dist
          merge-multiple: true
      - name: Validate version and assemble release
        shell: bash
        run: |
          set -euo pipefail

          # Same grammar release.sh validates against, so a tag can never be
          # creatable locally but rejected here.
          . scripts/release-tag.sh

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ $RELEASE_TAG_REGEX ]]; then
            echo "invalid release tag: $tag" >&2
            echo "expected v<upstream-xorg-version>-r<positive-revision>" >&2
            exit 1
          fi
          upstream_version="${BASH_REMATCH[1]}"
          release_version="${tag#v}"

          for arch in x86_64 aarch64; do
            archive="dist/xvfb-static-linux-$arch.tar.gz"
            test -s "$archive"
            manifest="$(tar -xOf "$archive" share/xvfb-static/manifest.json)"
            manifest_release="$(jq -er '.version' <<<"$manifest")"
            manifest_upstream="$(jq -er '.components["xorg-server"]' <<<"$manifest")"
            if [[ "$manifest_release" != "$release_version" ]]; then
              echo "$archive declares release $manifest_release, but tag $tag declares $release_version" >&2
              exit 1
            fi
            if [[ "$manifest_upstream" != "$upstream_version" ]]; then
              echo "$archive contains X.Org Server $manifest_upstream, but tag $tag declares $upstream_version" >&2
              exit 1
            fi

            llvmpipe_archive="dist/xvfb-static-glx-llvmpipe-alpha-linux-$arch.tar.gz"
            test -s "$llvmpipe_archive"
            llvmpipe_manifest="$(tar -xOf "$llvmpipe_archive" share/xvfb-static/manifest.json)"
            llvmpipe_release="$(jq -er '.version' <<<"$llvmpipe_manifest")"
            llvmpipe_upstream="$(jq -er '.components["xorg-server"]' <<<"$llvmpipe_manifest")"
            jq -e '.variant == "glx" and .maturity == "alpha" and .renderer == "llvmpipe"' \
              <<<"$llvmpipe_manifest" >/dev/null
            if [[ "$llvmpipe_release" != "$release_version" ]]; then
              echo "$llvmpipe_archive declares release $llvmpipe_release, but tag $tag declares $release_version" >&2
              exit 1
            fi
            if [[ "$llvmpipe_upstream" != "$upstream_version" ]]; then
              echo "$llvmpipe_archive contains X.Org Server $llvmpipe_upstream, but tag $tag declares $upstream_version" >&2
              exit 1
            fi

            external_vulkan_archive="dist/xvfb-static-glx-external-vulkan-alpha-linux-$arch.tar.gz"
            test -s "$external_vulkan_archive"
            external_vulkan_manifest="$(tar -xOf "$external_vulkan_archive" share/xvfb-static/manifest.json)"
            external_vulkan_release="$(jq -er '.version' <<<"$external_vulkan_manifest")"
            external_vulkan_upstream="$(jq -er '.components["xorg-server"]' <<<"$external_vulkan_manifest")"
            jq -e '.variant == "glx" and .maturity == "alpha" and .renderer == "zink"' \
              <<<"$external_vulkan_manifest" >/dev/null
            if [[ "$external_vulkan_release" != "$release_version" ]]; then
              echo "$external_vulkan_archive declares release $external_vulkan_release, but tag $tag declares $release_version" >&2
              exit 1
            fi
            if [[ "$external_vulkan_upstream" != "$upstream_version" ]]; then
              echo "$external_vulkan_archive contains X.Org Server $external_vulkan_upstream, but tag $tag declares $upstream_version" >&2
              exit 1
            fi
          done

          (
            cd dist
            sha256sum \
              xvfb-static-linux-x86_64.tar.gz \
              xvfb-static-linux-aarch64.tar.gz \
              xvfb-static-glx-llvmpipe-alpha-linux-x86_64.tar.gz \
              xvfb-static-glx-llvmpipe-alpha-linux-aarch64.tar.gz \
              xvfb-static-glx-external-vulkan-alpha-linux-x86_64.tar.gz \
              xvfb-static-glx-external-vulkan-alpha-linux-aarch64.tar.gz > SHA256SUMS
          )

          nixpkgs_revision="$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)"
          # Derive rather than restate: keyboard-profiles.nix is the catalog.
          profile_count="$(grep -c '^  { id = ' keyboard-profiles.nix)"
          test "$profile_count" -gt 0
          {
            printf 'xvfb-static %s packages X.Org Server %s.\n\n' "$tag" "$upstream_version"
            printf -- '- x86_64: built and boot-tested on a native GitHub-hosted runner\n'
            printf -- '- aarch64: built and boot-tested on a native GitHub-hosted runner\n'
            printf -- '- standard and GLX llvmpipe alpha archives were built and tested for both architectures\n'
            printf -- '- GLX external Vulkan alpha archives were built and smoke-tested for both architectures\n'
            printf -- '- GLX llvmpipe alpha uses Mesa llvmpipe software rendering and is experimental\n'
            printf -- '- GLX external Vulkan alpha uses host-assisted Mesa Zink/Vulkan rendering and is experimental; this workflow does not prove actual-GPU execution\n'
            printf -- '- all six archives have GitHub build-provenance attestations\n'
            printf -- '- nixpkgs revision: `%s`\n' "$nixpkgs_revision"
            printf -- '- source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'This build embeds %s curated keyboard profiles. `us` is the default; select another at startup with `-keyboard PROFILE`. Arbitrary layouts and live switching are unsupported.\n' "$profile_count"
          } > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/xvfb-static-linux-x86_64.tar.gz \
            dist/xvfb-static-linux-aarch64.tar.gz \
            dist/xvfb-static-glx-llvmpipe-alpha-linux-x86_64.tar.gz \
            dist/xvfb-static-glx-llvmpipe-alpha-linux-aarch64.tar.gz \
            dist/xvfb-static-glx-external-vulkan-alpha-linux-x86_64.tar.gz \
            dist/xvfb-static-glx-external-vulkan-alpha-linux-aarch64.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "xvfb-static $GITHUB_REF_NAME" \
            --notes-file release-notes.md

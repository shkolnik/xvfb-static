name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repo-checks:
    name: Shell syntax and documentation consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse every tracked script and check documented facts
        run: ./test/repo-checks.sh

  image-pins:
    name: Docker image pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require every image to be named once, by digest
        run: ./test/docker-image-pins.sh

  manylinux-lock:
    name: manylinux_2_28 lock updater
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject mutable and malformed image digests
        run: ./test/manylinux-2-28-lock.sh

  build-and-smoke:
    name: Build and smoke-test (${{ matrix.variant }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            variant: standard
            archive: out/x86_64/xvfb-static-linux-x86_64.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: standard
            archive: out/aarch64/xvfb-static-linux-aarch64.tar.gz
          - arch: x86_64
            runner: ubuntu-24.04
            variant: glx-llvmpipe
            archive: out/glx-llvmpipe-alpha/x86_64/xvfb-static-glx-llvmpipe-alpha-linux-x86_64.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: glx-llvmpipe
            archive: out/glx-llvmpipe-alpha/aarch64/xvfb-static-glx-llvmpipe-alpha-linux-aarch64.tar.gz
          - arch: x86_64
            runner: ubuntu-24.04
            variant: glx-external-vulkan
            archive: out/glx-external-vulkan-alpha/x86_64/xvfb-static-glx-external-vulkan-alpha-linux-x86_64.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: glx-external-vulkan
            archive: out/glx-external-vulkan-alpha/aarch64/xvfb-static-glx-external-vulkan-alpha-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    # Pull requests from forks get anonymous cache reads only; trusted branch
    # builds also receive the write credentials.
    env:
      CACHIX_CACHE_NAME: xvfb-static
      CACHIX_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
      CACHIX_SIGNING_KEY: ${{ github.event_name != 'pull_request' && secrets.CACHIX_SIGNING_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: matrix.variant == 'standard'
        name: Build standard archive
        run: ./build.sh "${{ matrix.arch }}"
      - if: matrix.variant == 'glx-llvmpipe'
        name: Build GLX llvmpipe alpha archive
        run: ./build-glx-llvmpipe.sh "${{ matrix.arch }}"
      - if: matrix.variant == 'glx-external-vulkan'
        name: Build GLX external Vulkan alpha archive
        run: ./build-glx-external-vulkan.sh "${{ matrix.arch }}"

      # Archive shape, manifest inventory, and licence checks apply to every
      # variant, including the host-assisted one that cannot take the static
      # Alpine boot test below.
      - name: Check archive shape, manifest, and licences
        run: ./test/archive-checks.sh "${{ matrix.archive }}"

      - if: matrix.variant != 'glx-external-vulkan'
        name: Boot packaged Xvfb in clean Alpine
        run: ./test/smoke.sh "${{ matrix.archive }}"

      - if: matrix.variant == 'standard'
        name: Verify all embedded keyboard profiles
        run: ./test/integration.sh "${{ matrix.arch }}"

      - if: matrix.variant != 'standard'
        name: Build GLX render test
        run: |
          docker run --rm \
            -e CACHIX_CACHE_NAME -e CACHIX_AUTH_TOKEN -e CACHIX_SIGNING_KEY \
            -v "$PWD":/src -w /src \
            -v xvfb-static-nix:/nix \
            "$(cat build-image.txt)" \
            sh -eu -c '
              git config --global --add safe.directory /src
              bash /src/nix-build-cached.sh nix \
                --extra-experimental-features "nix-command flakes" build \
                --impure --file /src/test/glx-render.nix \
                --out-link /tmp/result-glx-render-test --option log-lines 200
              test -x /tmp/result-glx-render-test/bin/glx-render-test
              rm -rf /src/result-glx-render-test
              mkdir -p /src/result-glx-render-test/bin
              install -m 0755 /tmp/result-glx-render-test/bin/glx-render-test \
                /src/result-glx-render-test/bin/glx-render-test
            '
          test -x result-glx-render-test/bin/glx-render-test

      - if: matrix.variant == 'glx-llvmpipe'
        name: Render with packaged GLX llvmpipe alpha in Alpine
        run: ./test/glx-llvmpipe-smoke.sh "${{ matrix.archive }}"

      # The glibc-2.28 symbol gate is load-bearing for the host-assisted
      # artifact, so exercise the toolchain that establishes it.
      - if: matrix.variant == 'glx-external-vulkan'
        name: Verify manylinux_2_28 toolchain and glibc symbol floor
        run: ./test/manylinux-2-28-toolchain.sh
      - if: matrix.variant == 'glx-external-vulkan'
        name: Verify external Vulkan ABI and Zink render
        run: ./test/glx-external-vulkan-smoke.sh "${{ matrix.archive }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.variant == 'standard'
        with:
          name: xvfb-static-linux-${{ matrix.arch }}
          path: |
            ${{ matrix.archive }}
            out/${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.variant == 'glx-llvmpipe'
        with:
          name: xvfb-static-glx-llvmpipe-alpha-linux-${{ matrix.arch }}
          path: |
            ${{ matrix.archive }}
            out/glx-llvmpipe-alpha/${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.variant == 'glx-external-vulkan'
        with:
          name: xvfb-static-glx-external-vulkan-alpha-linux-${{ matrix.arch }}
          path: |
            ${{ matrix.archive }}
            out/glx-external-vulkan-alpha/${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error

  build-success:
    name: build-success
    if: always()
    needs: [repo-checks, image-pins, manylinux-lock, build-and-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and test to pass
        run: |
          test "${{ needs.repo-checks.result }}" = success
          test "${{ needs.image-pins.result }}" = success
          test "${{ needs.manylinux-lock.result }}" = success
          test "${{ needs.build-and-smoke.result }}" = success
